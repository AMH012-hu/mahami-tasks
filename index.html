<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مهامي</title>
<meta name="description" content="تطبيق عربي لتنظيم المهام والمشاريع اليومية. بياناتك تبقى على جهازك.">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مهامي">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true">✓</span><div><h1>مهامي <small>مساحتك للإنجاز</small></h1><span id="date" class="date"></span></div><span class="local-badge">● على جهازك</span></div>
    <form id="quick" class="quick" autocomplete="off">
      <input id="q" type="text" maxlength="120" placeholder="ما الذي تريد إنجازه؟" aria-label="مهمة جديدة" enterkeyhint="done">
      <button class="btn primary" type="submit">إضافة</button>
    </form>
    <div class="opts" id="opts" role="group" aria-label="خيارات المهمة الجديدة">
      <div class="seg" id="qprio" role="radiogroup" aria-label="الأولوية"></div>
      <button type="button" class="chip" id="qtoday" aria-pressed="false">اليوم</button>
      <button type="button" class="chip" id="qtomorrow" aria-pressed="false">غداً</button>
      <label class="chip datechip"><span id="qdatelabel">تاريخ</span><input type="date" id="qdate" aria-label="تاريخ الاستحقاق"></label>
      <select id="qproj" class="chip" aria-label="المشروع"></select>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
  <p id="toast" class="toast" role="status" aria-live="polite"></p>
</div>
<nav class="tabs" id="tabs" aria-label="التنقل">
<div class="nav-brand"><span class="logo">✓</span><b>مهامي</b><small>خطّط. ركّز. أنجز.</small></div>
<button data-tab="today" aria-current="page"><i>◈</i><span>مساحة اليوم</span></button>
<button data-tab="calendar"><i>▦</i><span>المخطط</span></button>
<button data-tab="all"><i>☰</i><span>كل المهام</span></button>
<button data-tab="board"><i>▥</i><span>لوحة العمل</span></button>
<button data-tab="projects"><i>◇</i><span>المشاريع</span></button>
<button data-tab="focus"><i>◷</i><span>التركيز</span></button>
<button data-tab="settings"><i>⚙</i><span>الإعدادات</span></button>
<div class="nav-foot">خطوة صغيرة، كل يوم.<br><span>بيانات محلية · يعمل دون إنترنت</span></div>
</nav>
<dialog id="dlg" aria-labelledby="dlgtitle">
  <form method="dialog" id="editform">
    <h2 id="dlgtitle">تعديل المهمة</h2>
    <label>العنوان<input id="e-title" maxlength="120" required></label>
    <label>ملاحظات<textarea id="e-note" rows="3" maxlength="500"></textarea></label>
    <div class="grid">
<label>وقت البداية<input type="time" id="e-time"></label>
<label>المدة بالدقائق<input type="number" min="5" max="720" step="5" id="e-duration"></label>
<label>التكرار<select id="e-repeat"><option value="">لا يتكرر</option><option value="daily">يومياً</option><option value="weekly">أسبوعياً</option><option value="monthly">شهرياً</option></select></label>
<label>الحالة<select id="e-status"><option value="todo">لم تبدأ</option><option value="doing">قيد التنفيذ</option></select></label>
      <label>الأولوية<select id="e-prio"></select></label>
      <label>الاستحقاق<input type="date" id="e-date"></label>
      <label>المشروع<select id="e-proj"></select></label>
    </div>
    <label>خطوات المهمة، كل خطوة في سطر<textarea id="e-subtasks" rows="3" maxlength="2000" placeholder="قسّم المهمة لخطوات صغيرة"></textarea></label>
<div id="subtask-checks"></div>
<div class="row"><button type="button" class="btn" id="e-calendar">إرسال إلى Google Calendar ↗</button><button type="button" class="btn" id="e-focus">جلسة تركيز</button></div>
<p class="note">الإرسال يفتح مسودة موعد لتراجعها وتحفظها بنفسك. ليس مزامنة.</p>
<div class="row end">
      <button type="button" class="btn danger" id="e-del">حذف</button>
      <span class="sp"></span>
      <button type="button" class="btn" id="e-cancel">إلغاء</button>
      <button type="submit" class="btn primary" id="e-save">حفظ</button>
    </div>
  </form>
</dialog>
<script src="ical.min.js"></script>
<script src="app.js"></script>
</body>
</html>
